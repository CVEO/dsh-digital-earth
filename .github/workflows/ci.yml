name: CI

# 每次 push / PR 到 main 或 develop 都跑：
#   安装构建依赖 → 语法检查 → 客户端产物一致性 → 架构预算 → node:test 结构/行为测试
#   → 打包清单 → 真实打包冒烟（解包后 import 宿主入口）。
# publish.yml 会在发布前独立重跑同一组校验，不依赖本工作流的结论。
#
# v1.5 起 client.js 由 src/client 经 esbuild 构建（唯一 devDependency，仅构建期使用），
# 所以这里需要 npm ci；运行期依赖仍然是零。`build:client --check` 保证「源码改了
# 但产物没重建」的提交无法通过 CI，`scripts/check-size.mjs` 阻止单文件重新长成巨石。

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

# 同一 ref 的新推送取消旧任务；PR 与分支 push 的 ref 不同，各自独立。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Windows 腿是行尾/path 回归的保险：Git for Windows 的 core.autocrlf 若把
    # 结构测试读到的源码写成 CRLF，或任务里出现 POSIX-only 写法，这里会先红。
    # 两个平台统一用 bash（Windows 上是 Git Bash），让下面的 POSIX 冒烟脚本
    # 成为同一份实现，而不是平台分支。
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Install build dependencies
        # esbuild 只在构建期使用；package-lock.json 固定版本，运行期依赖仍为空。
        run: npm ci

      - name: Syntax check
        run: node --check index.js && node --check client.js

      - name: Client artifact is up to date
        run: npm run build:client -- --check

      - name: Architecture budgets
        run: node scripts/check-size.mjs

      - name: Structural tests
        run: node --test

      - name: Package manifest
        run: npm pack --dry-run

      - name: Package smoke test
        # 真实打包一次再解包，验证发布产物（而不是工作区）里确实有入口与随包资源，
        # 且宿主入口在干净目录下能被 Node 加载。能拦住 files 白名单漏项、
        # 入口路径写错、vendor 未随包分发这类「装得上但加载不了」的问题。
        run: |
          set -euo pipefail
          # 相对路径：Git Bash 在 Windows 上把 mktemp 的 /tmp 路径交给原生
          # tar/node 时不一定转换，工作区内的相对目录在两个平台都稳定。
          DEST=".package-smoke-$$"
          mkdir -p "$DEST"
          TARBALL=""
          cleanup() {
            rm -rf "$DEST"
            if [ -n "$TARBALL" ]; then rm -f "$TARBALL"; fi
          }
          trap cleanup EXIT

          TARBALL="$(npm pack --silent | tail -n 1)"
          tar -xzf "$TARBALL" -C "$DEST"

          for FILE in index.js client.js cordis.patch.yml vendor/cesium/Cesium.js; do
            test -f "$DEST/package/$FILE" || { echo "::error::打包结果缺少 $FILE"; exit 1; }
          done
          # 拆包后宿主入口会 import src/host/**，漏发会让插件装上却加载失败。
          test -d "$DEST/package/src/host" || { echo "::error::打包结果缺少 src/host"; exit 1; }

          ENTRY="$DEST/package/index.js"
          # Windows 上 ESM 不能直接 import 盘符绝对路径，必须转成 file:// URL。
          node --input-type=module -e "const { pathToFileURL } = await import('node:url'); const m = await import(pathToFileURL(process.argv[1]).href); if (typeof m.apply !== 'function') { console.error('index.js 未导出 apply()'); process.exit(1) }" "$ENTRY"
          echo "打包冒烟通过：$TARBALL"
